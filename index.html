/* ---------- 1. SALES ---------- */

function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab==S.tab));const y=scrollY;
  try{$('#app').innerHTML=S.tab=='sales'?rSales():S.tab=='redeem'?rRedeem():S.tab=='promo'?rPromo():rStock()}catch(e){$('#app').innerHTML='<div class="note warn">Error render: '+esc(e.message)+'</div>';console.error(e)}scrollTo(0,y)}
document.addEventListener('change',e=>{const dd=e.target.dataset||{};if(dd.bg){const[gi,gf]=dd.bg.split('|');S.bg[+gi][gf]=+e.target.value||0;savePl();render();return}if(dd.bd){S.bd[dd.bd]=+e.target.value||0;savePl();render();return}if(dd.bl){const[bi,bf]=dd.bl.split('|');S.bl[+bi][bf]=+e.target.value||0;savePl();render();return}const pl=e.target.dataset?.pl;if(pl){const[i,f]=pl.split('|');S.pl[+i][f]=+e.target.value||0;savePl();render();return}const k=e.target.dataset?.k;if(k){S[k]=e.target.type=='number'?+e.target.value:e.target.type=='checkbox'?e.target.checked:e.target.value;if(k=='pmAll'&&S.help)for(const h in S.help)if(h.startsWith('pm'))delete S.help[h];render()}});
document.addEventListener('click',e=>{const d=e.target.dataset||{};if(d.tab){S.tab=d.tab;render()}else if(d.act=='add'){addLine(document.querySelector('#padd').value);render()}else if(d.act=='sug'){loadPl();suggestIds().forEach(id=>{if(!S.pl.some(l=>l.id==id))addLine(id)});render()}else if(d.act=='del'){S.pl.splice(+d.i,1);savePl();render()}else if(d.act=='clr'){S.pl=[];savePl();render()}else if(d.act=='addg'){addBogo(document.querySelector('#gbuy').value,document.querySelector('#gfree').value,+document.querySelector('#gbq').value,+document.querySelector('#gfq').value);render()}else if(d.act=='delg'){S.bg.splice(+d.i,1);savePl();render()}else if(d.act=='clrg'){S.bg=[];savePl();render()}else if(d.act=='addc'){addComp(document.querySelector('#cadd').value);render()}else if(d.act=='delc'){S.bl.splice(+d.i,1);savePl();render()}else if(d.act=='poster'){posterExample();render()}else if(d.act=='clrb'){S.bl=[];savePl();render()}});
$('#refresh').onclick=async()=>{$('#refresh').disabled=true;await load();$('#refresh').disabled=false};
load();
</script></body></html>
